name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to attach the exe to a GitHub Release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run tests
        run: dotnet run --project tests/DesktopFences.Tests

      - name: Publish single-file exe
        run: >
          dotnet publish DesktopFences -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopFences
          path: publish/DesktopFences.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DesktopFences.exe
          generate_release_notes: true
